name: Valua CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Valua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/moonstone
          ref: main
          path: .ci/moonstone
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/ballad
          path: .ci/ballad
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install release tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y b3sum file jq libsqlite3-dev lsof pkg-config zstd
      - name: Build Moonstone CLI
        working-directory: .ci/moonstone
        run: |
          zig build
          echo "$GITHUB_WORKSPACE/.ci/moonstone/zig-out/bin" >> "$GITHUB_PATH"
      - name: Synchronize project
        run: moon sync
      - name: Prepare locked Ballad integration checkout
        run: |
          ln -s "$GITHUB_WORKSPACE/.ci/ballad" "$GITHUB_WORKSPACE/../ballad"
          cd .ci/ballad
          moon sync
      - name: Run test suite
        run: moon run test
      - name: Export release candidate with Ballad
        run: moon exec ballad play partiture.lua
