manifest_version = 2

[package]
name = "valua"
version = "0.2.1"
kind = "lib"
description = "Deterministic schema declaration, runtime validation, and static type inference for Lua"

[interpreter]
name = "lua"
version = "5.4"
abi = "5.4"

[scripts]
test = "lua tests/runner.lua"
package = "moon exec ballad -- play partiture.lua"

[[dependencies]]
name = "moonstone/ballad"
constraint = "^0.3.5"
role = "tool"
